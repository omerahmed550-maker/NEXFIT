<body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout concept: single-column phone app. Sticky wordmark header, card stack, fixed five-tab bar, full-screen sheets for every editor. */
:root {
  --bg: #0a0b09; --surface: #141612; --surface2: #1d201a; --line: #2b2f26;
  --fg: #f2f4ec; --muted: #9aa092; --accent: #c8f53a; --accent-fill: #c8f53a; --accent-ink: #11160a;
  --bad: #ff6b5e; --on-bad: #1a0705; --warn: #f2b84b; --scrim: rgba(0, 0, 0, .62);
  --disp: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f4ee; --surface: #ffffff; --surface2: #eceee4; --line: #d9dccf;
    --fg: #151810; --muted: #5b6253; --accent: #4a7500; --accent-fill: #bff02a; --accent-ink: #11160a;
    --bad: #c62f22; --on-bad: #ffffff; --warn: #8f6200; --scrim: rgba(20, 24, 12, .5);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f4ee; --surface: #ffffff; --surface2: #eceee4; --line: #d9dccf;
  --fg: #151810; --muted: #5b6253; --accent: #4a7500; --accent-fill: #bff02a; --accent-ink: #11160a;
  --bad: #c62f22; --on-bad: #ffffff; --warn: #8f6200; --scrim: rgba(20, 24, 12, .5);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font: 16px/1.4 var(--body); min-height: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 560px; width: 100%; margin-inline: auto; padding-inline: 16px; }
#view { display: flex; flex-direction: column; gap: 12px; padding-block: 8px calc(92px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; align-items: baseline; justify-content: space-between; padding-block: 8px 2px; }
.top h1 { font: 700 30px/1 var(--disp); letter-spacing: .04em; text-transform: uppercase; }
.top h1 span { color: var(--accent); }
.top .date { color: var(--muted); font-size: 14px; }
.num { font-family: var(--disp); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.big { font: 700 46px/1 var(--disp); font-variant-numeric: tabular-nums; }
.big small, .pv-k small { font: 500 18px var(--body); color: var(--muted); }
.lg { font-size: 28px; }
.muted { color: var(--muted); }
.sm { font-size: 13px; }
.xs { font-size: 12px; }
.center { text-align: center; }
.up { color: var(--accent); font-weight: 600; }
.dn { color: var(--warn); font-weight: 600; }
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec { font: 600 13px var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding-top: 6px; }
.note { font-size: 13px; color: var(--muted); }
.prose { line-height: 1.55; }
.flip { display: inline-flex; transform: scaleX(-1); }
.ico { flex: none; }

/* cards & rows */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { font: 600 20px/1.1 var(--disp); letter-spacing: .03em; text-transform: uppercase; }
.card.center { align-items: center; text-align: center; }
.block { width: 100%; }
.erow { display: flex; align-items: center; gap: 12px; min-height: 56px; width: 100%; padding: 8px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-align: left; }
.erow.static { cursor: default; }
.erow.sel { border-color: var(--accent); }
.erow.pr { border-color: var(--accent); }
.en { display: flex; flex-direction: column; min-width: 0; flex: 1; text-align: left; background: none; border: 0; padding: 0; }
.en b { font-weight: 600; overflow-wrap: anywhere; }
.en small { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.linkish { cursor: pointer; }
.hrow { flex-direction: row; align-items: center; justify-content: space-between; text-align: left; width: 100%; }
.badge { background: var(--accent-fill); color: var(--accent-ink); font: 700 12px var(--body); padding: 3px 8px; border-radius: 99px; letter-spacing: .04em; flex: none; }
.thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; }
.ph { display: grid; place-items: center; background: var(--surface2); color: var(--accent); font: 700 20px var(--disp); }
.sn { width: 22px; color: var(--muted); font: 600 14px var(--disp); text-align: center; flex: none; }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }
.empty b { color: var(--fg); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 10px; width: 100%; }
.stats div { display: flex; flex-direction: column; min-width: 0; }
.stats b { font: 700 28px/1.05 var(--disp); }
.stats span, .stat-mini span { font-size: 12px; color: var(--muted); }
.stat-mini { display: flex; flex-direction: column; justify-content: center; }
.stat-mini b { font: 700 28px/1 var(--disp); }
.two, .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > div { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.grid2 .lbl { margin-bottom: 0; }
.dash { font: 400 40px var(--body); color: var(--muted); }
.kcal-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.kcal-left { text-align: right; font-weight: 600; min-width: 0; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.mrow { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.mrow-h { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); }
.mrow-h .num { color: var(--fg); font-size: 17px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent-fill); border-radius: 99px; }
.bar.over i { background: var(--warn); }
.datenav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.datepick { position: relative; flex: 1; text-align: center; font: 600 22px var(--disp); letter-spacing: .03em; text-transform: uppercase; min-height: 44px; display: grid; place-items: center; }
.datepick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; }
.meal-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.meal-a { display: flex; flex-wrap: wrap; gap: 8px; }
.resume { flex-direction: row; align-items: center; justify-content: space-between; border-color: var(--accent); }
.plan-h { display: flex; align-items: center; gap: 6px; }
.tools { display: inline-flex; flex: none; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.lg-a { background: var(--accent); } .lg-b { background: var(--muted); }
.lg-b.dot { width: 8px; height: 8px; border-radius: 50%; }
.chartcard { width: 100%; }
.chart { width: 100%; height: auto; display: block; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .tx { fill: var(--muted); font: 11px var(--body); }
.preview { align-items: center; text-align: center; }
.pv-k { font: 700 40px/1 var(--disp); }
.pv-m { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 14px; color: var(--muted); }
.pv-m b { color: var(--fg); }
.priv { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ptile { position: relative; border: 2px solid transparent; border-radius: 10px; padding: 0; overflow: hidden; background: var(--surface2); aspect-ratio: 3/4; }
.ptile.sel { border-color: var(--accent); }
.ptile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ptile span { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 4px; font-size: 12px; color: #fff; background: linear-gradient(transparent, rgba(0, 0, 0, .65)); text-align: left; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp figure { margin: 0; min-width: 0; }
.cmp img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; display: block; }
.cmp figcaption { font-size: 13px; margin-top: 6px; color: var(--muted); }
.cmp figcaption b { color: var(--fg); }
.hero-img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; background: var(--surface2); display: block; }
.hero-img.tall { max-height: 440px; }
.img-empty { border: 1px dashed var(--line); border-radius: 12px; padding: 20px 14px; text-align: center; font-size: 14px; }

/* controls */
.btn { min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--fg); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 15px; }
.btn.xs { min-height: 38px; padding: 0 12px; font-size: 14px; }
.btn.primary { background: var(--accent-fill); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--bad); color: var(--on-bad); border-color: transparent; }
.btn.danger-t { background: transparent; color: var(--bad); }
.btn.on { border-color: var(--accent); color: var(--accent); }
.btn.grow { flex: 1; }
.btn.file { cursor: pointer; }
.btn:disabled, .icon-btn:disabled { opacity: .38; cursor: default; }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: 12px; display: grid; place-items: center; background: transparent; border: 0; }
.icon-btn.sm { width: 38px; height: 38px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips.pad { padding-block: 2px; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface2); font-weight: 500; font-size: 15px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--accent-fill); color: var(--accent-ink); border-color: transparent; }
.chip.static { cursor: default; }
.meal-chip { border-color: var(--accent); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.seg button { min-height: 42px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; font-size: 15px; }
.seg button.on { background: var(--accent-fill); color: var(--accent-ink); }
.lbl { display: block; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: -6px; }
.in { width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--fg); font: 16px var(--body); min-width: 0; }
.in:focus, .btn:focus-visible, .chip:focus-visible, .icon-btn:focus-visible, .erow:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.in.lg { font: 600 30px var(--disp); min-height: 60px; }
textarea.in { resize: vertical; line-height: 1.4; }
.searchbar { display: flex; gap: 8px; }
.searchbar .in { flex: 1; }
.itemrow { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.in.amt { width: 76px; flex: none; text-align: center; padding-inline: 4px; }
.title-in { font: 700 26px var(--disp); letter-spacing: .02em; text-transform: uppercase; }

/* nav */
#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 4px 4px env(safe-area-inset-bottom, 0px); }
#nav button { min-height: 58px; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
#nav button[aria-current="page"] { color: var(--accent); }
#nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 10px; }

/* sheets */
.sheet { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.sheet.dialog { background: var(--scrim); justify-content: center; align-items: center; padding: 16px; z-index: 80; }
.sheet-head { display: flex; align-items: center; gap: 6px; min-height: 56px; padding-inline: 8px; border-bottom: 1px solid var(--line); background: var(--surface); }
.sheet-head h2 { flex: 1; font: 700 24px var(--disp); letter-spacing: .03em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head-right { display: flex; align-items: center; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 14px 28px; }
.sheet-body > .wrap { display: flex; flex-direction: column; gap: 12px; }
.sheet-foot { border-top: 1px solid var(--line); background: var(--surface); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.foot-row { display: flex; gap: 10px; }
.dlg { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
.dlg h3 { font: 700 24px var(--disp); text-transform: uppercase; letter-spacing: .02em; }
.dlg p { color: var(--muted); }
.dlg-btns { display: flex; gap: 10px; justify-content: flex-end; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin-inline: auto; z-index: 99; padding: 12px 16px; border-radius: 12px; background: var(--fg); color: var(--bg); font-weight: 600; text-align: center; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .18s, transform .18s; }
.toast.show { opacity: 1; transform: none; }
.toast.err { background: var(--bad); color: var(--on-bad); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* workout */
.rest { position: sticky; top: -14px; z-index: 5; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.rest.on { border-color: var(--accent); flex-wrap: nowrap; }
.rest .num.lg { min-width: 62px; color: var(--accent); }
.rest-prog { flex: 1; height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; min-width: 20px; }
.rest-prog i { display: block; height: 100%; width: 0; background: var(--accent-fill); }
.exc-h { display: flex; align-items: center; gap: 10px; }
.exc-f { display: flex; gap: 8px; align-items: center; }
.sm-in { min-height: 40px; font-size: 15px; }
.last { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--surface2); }
.last .num { flex: 1; font-size: 15px; min-width: 0; }
.sets-h, .set { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr) 58px 44px 34px; gap: 6px; align-items: center; }
.sets-h { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: center; }
.set-in { text-align: center; padding-inline: 4px; min-height: 46px; font: 600 20px var(--disp); }
.set-rpe { padding-inline: 2px; min-height: 46px; font-size: 14px; text-align: center; }
.done-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--muted); display: grid; place-items: center; padding: 0; }
.done-btn.on { background: var(--accent-fill); color: var(--accent-ink); border-color: transparent; }
.set.done .set-in { color: var(--accent); }
.set .sn { width: auto; }

@media (min-width: 640px) { #view { padding-top: 16px; } }

.howto { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--muted); }
.howto b { color: var(--fg); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wcell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); min-width: 0; }
.wcell.today { border-color: var(--accent); }
.wcell.fut { opacity: .45; }
.wcell b { font-size: 18px; line-height: 1; }
.dots { display: flex; gap: 3px; margin-top: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--line); }
.dots i.on { background: var(--accent-fill); border-color: transparent; }
.dots i.on.f { background: var(--muted); }
.dots i.on.g { background: var(--warn); }
.lg-c { background: var(--warn); }

</style>
<div id="app"><main id="view" class="wrap" aria-live="polite"></main><nav id="nav" aria-label="Main"></nav><div id="toast" class="toast" role="status" aria-live="polite"></div></div>
<script>
'use strict';
/* NEX FIT core: helpers, storage (IndexedDB), units, calculations, sheets */
const VERSION = '1.1.0', SCHEMA = 1;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const weekStart = s => { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const isYmd = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseYmd(s));
const fmtDate = (s, o) => parseYmd(s).toLocaleDateString(undefined, o || { weekday: 'short', day: 'numeric', month: 'short' });
const fmtDateY = s => fmtDate(s, { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDateLong = s => fmtDate(s, { weekday: 'long', day: 'numeric', month: 'long' });
const fmtMonth = s => fmtDate(s, { month: 'long', year: 'numeric' });
const fmtDur = sec => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
const fmtN = (v, d = 1) => (v == null || !isFinite(v)) ? '—' : String(+v.toFixed(d));
const sum = a => a.reduce((x, y) => x + y, 0);
const avg = a => a.length ? sum(a) / a.length : null;
const clone = o => JSON.parse(JSON.stringify(o));

const MUSCLES = ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Quads', 'Hamstrings', 'Glutes', 'Calves', 'Core', 'Full body', 'Cardio'];
const EQUIP = ['Barbell', 'Dumbbell', 'Machine', 'Cable', 'Bodyweight', 'Kettlebell', 'Band', 'Other'];
const MEALS = [['breakfast', 'Breakfast'], ['lunch', 'Lunch'], ['dinner', 'Dinner'], ['snacks', 'Snacks']];
const DAYN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYORDER = [1, 2, 3, 4, 5, 6, 0];
const DEF_MEAS = ['Waist', 'Chest', 'Left arm', 'Right arm', 'Left thigh', 'Right thigh', 'Hips', 'Neck'];

const S = { settings: null, active: null, meta: {}, exercises: [], templates: [], workouts: [], foods: [], entries: [], meals: [], weights: [], measurements: [], photos: [] };
const STORES = ['exercises', 'templates', 'workouts', 'foods', 'entries', 'meals', 'weights', 'measurements', 'photos'];
const DEFAULT_SETTINGS = () => ({ theme: 'dark', targets: { kcal: null, p: null, c: null, f: null }, wUnit: 'kg', lUnit: 'cm', rest: 90, restAuto: true, restAlert: true, lastBackup: null, firstRun: Date.now() });
let idb = null, storageOK = false, wkVersion = 0;

/* ---------- storage ---------- */
function openDB() {
  return new Promise(res => {
    try {
      const rq = indexedDB.open('nexfit', 1);
      rq.onupgradeneeded = () => { const db = rq.result; STORES.forEach(s => db.createObjectStore(s, { keyPath: 'id' })); db.createObjectStore('kv', { keyPath: 'k' }); };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
      rq.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
}
function idbRun(fn) {
  return new Promise((res, rej) => {
    if (!idb) { res(); return; }
    try { const t = fn(idb); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); } catch (e) { rej(e); }
  });
}
function saveFail(e) { console.error(e); toast('Could not save to this device. Export a backup now.', 'err'); }
function put(store, obj) {
  const a = S[store], i = a.findIndex(x => x.id === obj.id);
  if (i >= 0) a[i] = obj; else a.push(obj);
  if (store === 'workouts') wkVersion++;
  idbRun(db => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).put(obj); return t; }).catch(saveFail);
  return obj;
}
function del(store, id) {
  S[store] = S[store].filter(x => x.id !== id);
  if (store === 'workouts') wkVersion++;
  idbRun(db => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).delete(id); return t; }).catch(saveFail);
}
function clearStore(store) {
  S[store] = [];
  if (store === 'workouts') wkVersion++;
  return idbRun(db => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).clear(); return t; }).catch(saveFail);
}
function kvSet(k, v) { return idbRun(db => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put({ k, v }); return t; }).catch(saveFail); }
function kvDel(k) { return idbRun(db => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); return t; }).catch(saveFail); }
const saveSettings = () => kvSet('settings', S.settings);
let activeTimer = null;
function saveActive() { clearTimeout(activeTimer); activeTimer = setTimeout(flushActive, 250); }
function flushActive() { clearTimeout(activeTimer); activeTimer = null; if (S.active) kvSet('active', S.active); else kvDel('active'); }
function loadAll() {
  return new Promise(res => {
    if (!idb) { res(); return; }
    const t = idb.transaction([...STORES, 'kv'], 'readonly');
    STORES.forEach(s => { t.objectStore(s).getAll().onsuccess = e => { S[s] = e.target.result; }; });
    t.objectStore('kv').getAll().onsuccess = e => e.target.result.forEach(o => { if (o.k === 'settings') S.settings = o.v; else if (o.k === 'active') S.active = o.v; else S.meta[o.k] = o.v; });
    t.oncomplete = () => res(); t.onerror = () => res(); t.onabort = () => res();
  });
}
function seedExercises() {
  if (S.meta.seeded) return;
  SEED.forEach(([name, muscle, equipment, instructions]) => {
    const id = 'ex_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
    if (!S.exercises.find(e => e.id === id)) put('exercises', { id, name, muscle, equipment, instructions, image: null, custom: false });
  });
  S.meta.seeded = true; kvSet('seeded', true);
}
async function initData() {
  idb = await openDB();
  storageOK = !!idb;
  await loadAll();
  if (!S.settings) { S.settings = DEFAULT_SETTINGS(); saveSettings(); }
  S.settings = Object.assign(DEFAULT_SETTINGS(), S.settings);
  S.settings.targets = Object.assign({ kcal: null, p: null, c: null, f: null }, S.settings.targets);
  seedExercises();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
}

/* ---------- units ---------- */
const KG2LB = 2.2046226218, CM2IN = 1 / 2.54;
const wUnit = () => S.settings.wUnit, lUnit = () => S.settings.lUnit;
const kgToDisp = kg => kg == null ? null : (wUnit() === 'lb' ? kg * KG2LB : kg);
const dispToKg = v => v == null ? null : Math.round((wUnit() === 'lb' ? v / KG2LB : v) * 1000) / 1000;
const cmToDisp = cm => cm == null ? null : (lUnit() === 'in' ? cm * CM2IN : cm);
const dispToCm = v => v == null ? null : Math.round((lUnit() === 'in' ? v * 2.54 : v) * 100) / 100;
const fW = (kg, d = 1) => fmtN(kgToDisp(kg), d);
const fWu = (kg, d = 1) => kg == null ? '—' : `${fW(kg, d)} ${wUnit()}`;
const fL = (cm, d = 1) => fmtN(cmToDisp(cm), d);
const bigv = t => t === '—' ? '<span class="dash">—</span>' : t;
const sign = v => v > 0 ? '+' : v < 0 ? '−' : '±';

/* ---------- nutrition math ---------- */
const MK = ['kcal', 'p', 'c', 'f'];
function macrosOf(e) { const o = {}; MK.forEach(k => { o[k] = e[k] == null ? null : e[k] * e.amount / (e.ref || 100); }); return o; }
function totals(list) {
  const t = { kcal: 0, p: 0, c: 0, f: 0, partial: false, n: list.length };
  list.forEach(e => { const m = macrosOf(e); MK.forEach(k => { if (m[k] == null) t.partial = true; else t[k] += m[k]; }); });
  return t;
}
const entriesOn = d => S.entries.filter(e => e.date === d);
const mealEntries = (d, m) => S.entries.filter(e => e.date === d && e.meal === m);
function frequentFoods(n = 8) {
  const cut = addDays(today(), -90), cnt = {};
  S.entries.forEach(e => { if (e.foodId && e.date >= cut) cnt[e.foodId] = (cnt[e.foodId] || 0) + 1; });
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([id]) => S.foods.find(f => f.id === id)).filter(Boolean).slice(0, n);
}
function defaultMeal() { const h = new Date().getHours(); return h < 11 ? 'breakfast' : h < 16 ? 'lunch' : h < 21 ? 'dinner' : 'snacks'; }

/* ---------- training math ---------- */
const epley = (w, r) => (w > 0 && r >= 1 && r <= 12) ? (r === 1 ? w : w * (1 + r / 30)) : null;
const wkKey = w => w.date + '|' + String(w.start || 0).padStart(15, '0');
const sortedWorkouts = () => S.workouts.slice().sort((a, b) => wkKey(a) < wkKey(b) ? -1 : 1);
function sessionOf(w, ex) {
  const sets = ex.sets.filter(s => s.done && s.r > 0);
  if (!sets.length) return null;
  const ws = sets.map(s => s.w || 0), e1s = sets.map(s => epley(s.w, s.r)).filter(v => v != null);
  const weighted = sets.filter(s => s.w > 0);
  return {
    wid: w.id, date: w.date, key: wkKey(w), sets,
    topW: Math.max(...ws), e1: e1s.length ? Math.max(...e1s) : null,
    vol: weighted.length ? sum(weighted.map(s => s.w * s.r)) : null,
    reps: sum(sets.map(s => s.r)), maxReps: Math.max(...sets.map(s => s.r)),
    maxRepsBW: Math.max(0, ...sets.filter(s => !(s.w > 0)).map(s => s.r))
  };
}
const exKey = ex => ex.exId || ('n:' + ex.name);
let sessCache = { v: -1, map: null };
function sessionsMap() {
  if (sessCache.v === wkVersion && sessCache.map) return sessCache.map;
  const map = {};
  sortedWorkouts().forEach(w => w.exercises.forEach(ex => { const s = sessionOf(w, ex); if (s) (map[exKey(ex)] = map[exKey(ex)] || []).push(s); }));
  sessCache = { v: wkVersion, map }; return map;
}
const sessionsFor = id => sessionsMap()[id] || [];
function lastSession(id, beforeKey, exceptWid) {
  const l = sessionsFor(id).filter(s => s.wid !== exceptWid && (!beforeKey || s.key < beforeKey));
  return l.length ? l[l.length - 1] : null;
}
let prCache = { v: -1, list: null };
function allPRs() {
  if (prCache.v === wkVersion && prCache.list) return prCache.list;
  const list = [];
  Object.entries(sessionsMap()).forEach(([id, ss]) => {
    let bw = 0, be = 0, br = 0;
    ss.forEach((s, i) => {
      if (i > 0) {
        if (s.topW > bw && s.topW > 0) list.push({ id, wid: s.wid, date: s.date, type: 'weight', val: s.topW, prev: bw });
        if (s.e1 != null && be > 0 && s.e1 > be + 1e-9) list.push({ id, wid: s.wid, date: s.date, type: 'e1rm', val: s.e1, prev: be });
        if (bw === 0 && s.maxRepsBW > br && br > 0) list.push({ id, wid: s.wid, date: s.date, type: 'reps', val: s.maxRepsBW, prev: br });
      }
      bw = Math.max(bw, s.topW); if (s.e1 != null) be = Math.max(be, s.e1); br = Math.max(br, s.maxRepsBW);
    });
  });
  prCache = { v: wkVersion, list }; return list;
}
function exName(id, fallback) { const e = S.exercises.find(x => x.id === id); return e ? e.name : (fallback || (id || '').replace(/^n:/, '') || 'Exercise'); }
function exById(id) { return S.exercises.find(x => x.id === id); }
function wkStats(w) {
  let sets = 0, vol = 0, volAny = false, ex = 0;
  w.exercises.forEach(e => { const d = e.sets.filter(s => s.done && s.r > 0); if (d.length) ex++; sets += d.length; d.forEach(s => { if (s.w > 0) { vol += s.w * s.r; volAny = true; } }); });
  return { sets, vol: volAny ? vol : null, ex };
}
function weightTrend() {
  const ws = S.weights.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  if (!ws.length) return null;
  const last = ws[ws.length - 1], t = today();
  const inR = (a, b) => ws.filter(x => x.date >= a && x.date <= b).map(x => x.kg);
  const cur = inR(addDays(t, -6), t), prev = inR(addDays(t, -13), addDays(t, -7));
  if (cur.length && prev.length) return { last, delta: avg(cur) - avg(prev), basis: '7-day avg vs previous 7 days' };
  if (ws.length >= 2) { const p = ws[ws.length - 2]; return { last, delta: last.kg - p.kg, basis: 'vs previous reading (' + fmtDate(p.date) + ')' }; }
  return { last, delta: null };
}

let toastT;
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + (kind || ''); clearTimeout(toastT); toastT = setTimeout(() => { t.className = 'toast'; }, 2800); }

const sheets = [];
function openSheet(render, props = {}) {
  const el = document.createElement('div'); el.className = 'sheet'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  const s = Object.assign({ render, el }, props);
  sheets.push(s); document.body.appendChild(el); document.body.classList.add('lock'); paintSheet(s); return s;
}
function paintSheet(s) {
  const b = s.el.querySelector('.sheet-body'), sc = b ? b.scrollTop : 0;
  s.el.innerHTML = s.render(s);
  const nb = s.el.querySelector('.sheet-body'); if (nb) nb.scrollTop = sc;
  if (s.after) s.after(s);
}
function closeSheet(s) {
  s = s || sheets[sheets.length - 1]; if (!s) return;
  const i = sheets.indexOf(s); if (i < 0) return;
  sheets.splice(i, 1); s.el.remove();
  if (!sheets.length) document.body.classList.remove('lock');
  if (s.onClose) s.onClose(s);
  if (s.kind !== 'dialog') rerender();
}
const sheetOf = el => { const n = el.closest('.sheet'); return sheets.find(x => x.el === n); };
function rerender() { renderPage(); sheets.slice().forEach(paintSheet); }
const sheetHTML = ({ title, body, foot, right = '', close = 'back' }) =>

function confirmBox({ title, msg, ok = 'Confirm', danger = false, typed = null }) {

    const s = openSheet(() => `<div class="dlg" role="alertdialog"><h3>${esc(title)}</h3><p>${esc(msg)}</p>${typed ? `<input class="in" id="cf-typed" placeholder="Type ${esc(typed)} to confirm" autocomplete="off" autocapitalize="characters">` : ''}<div class="dlg-btns"><button class="btn" data-act="cf-no">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-act="cf-yes" ${typed ? 'disabled' : ''}>${esc(ok)}</button></div></div>`, { kind: 'dialog', typed });
    s.el.classList.add('dialog'); s.resolve = res;

}

function setPath(o, path, v) { const p = path.split('.'); let c = o; for (let i = 0; i < p.length - 1; i++) { if (c[p[i]] == null || typeof c[p[i]] !== 'object') c[p[i]] = {}; c = c[p[i]]; } c[p[p.length - 1]] = v; }
function readVal(el) {
  if (el.type === 'checkbox') return el.checked;
  if (el.dataset.num !== undefined) { const v = el.value.trim().replace(',', '.'); if (v === '') return null; const n = parseFloat(v); return isFinite(n) ? n : null; }
  return el.value;
}
const ACT = {}, IN = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
function onField(e, isChange) {
  const el = e.target;
  if (el.id === 'cf-typed') { const s = sheetOf(el); el.closest('.dlg').querySelector('[data-act=cf-yes]').disabled = el.value.trim() !== s.typed; return; }
  if (el.dataset.d) { const s = sheetOf(el); if (s && s.draft) { setPath(s.draft, el.dataset.d, readVal(el)); if (el.dataset.live && s.live && !isChange) s.live(s, el); } }

document.addEventListener('input', e => onField(e, false));
/* 'change' also fires when a field loses focus (before the tap lands), so it must never re-render:
   it only keeps drafts in sync and runs explicit data-ch handlers (dates, files, repaint-on-select). */
document.addEventListener('change', e => { onField(e, true); const h = e.target.dataset.ch; if (h && IN[h]) IN[h](e.target, e); });

ACT['cf-yes'] = el => { const s = sheetOf(el); closeSheet(s); s.resolve(true); };
ACT['ask-no'] = el => { const s = sheetOf(el); closeSheet(s); s.resolve(null); };

/* image helper: file -> resized JPEG data URL */
function readImage(file, max, q = 0.82) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) { rej(new Error('That file is not an image.')); return; }
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Could not read that file.'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('This image format is not supported by your browser. Try a JPEG or PNG.'));
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
        const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- charts (hand-built SVG, one scale for marks and labels) ---------- */
function niceTicks(lo, hi, n = 4) {
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  const a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step, t = [];
  for (let v = a; v <= b + step * 1e-6; v += step) t.push(+v.toFixed(6));
  return t;
}
function lineChart({ series, unit = '', dec = 1, w = 340, h = 180, label = '' }) {
  const all = series.flatMap(s => s.pts); if (!all.length) return '';
  const L = 38, R = 14, T = 14, B = 26;
  let x0 = Math.min(...all.map(p => p.x)), x1 = Math.max(...all.map(p => p.x));
  if (x0 === x1) { x0 -= 864e5; x1 += 864e5; }
  const tk = niceTicks(Math.min(...all.map(p => p.y)), Math.max(...all.map(p => p.y)), 3), y0 = tk[0], y1 = tk[tk.length - 1];
  const X = x => L + (x - x0) / (x1 - x0) * (w - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (h - T - B);
  let g = tk.map(v => `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" class="tx">${fmtN(v, dec)}</text>`).join('');
  const xs = [x0, (x0 + x1) / 2, x1], fm = x => fmtDate(ymd(new Date(x)), { day: 'numeric', month: 'short' });
  g += xs.map((x, i) => `<text x="${X(x)}" y="${h - 8}" text-anchor="${i === 0 ? 'start' : i === 2 ? 'end' : 'middle'}" class="tx">${esc(fm(x))}</text>`).join('');
  series.forEach(s => {
    if (!s.pts.length) return;
    const d = s.pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join('');
    if (s.pts.length > 1 && !s.noline) g += `<path d="${d}" fill="none" stroke="${s.color || 'var(--accent)'}" stroke-width="${s.thin ? 1.6 : 2.4}" ${s.dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if (s.dots) g += s.pts.map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6" fill="${s.color || 'var(--accent)'}"/>`).join('');
    if (s.end) { const p = s.pts[s.pts.length - 1]; g += `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="5" fill="${s.color || 'var(--accent)'}" stroke="var(--surface)" stroke-width="2"/>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${g}</svg>`;
}
function barChart({ items, dec = 0, w = 340, h = 170, label = '' }) {
  const vals = items.map(i => i.value).filter(v => v != null); if (!vals.length) return '';
  const L = 40, R = 8, T = 12, B = 24, tk = niceTicks(0, Math.max(...vals), 3), y1 = tk[tk.length - 1];
  const bw = (w - L - R) / items.length, Y = v => T + (1 - v / y1) * (h - T - B);
  let g = tk.map(v => `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" class="tx">${fmtN(v, dec)}</text>`).join('');
  items.forEach((it, i) => {
    const cx = L + bw * i + bw / 2;
    if (it.value != null) g += `<rect x="${cx - bw * 0.32}" y="${Y(it.value)}" width="${bw * 0.64}" height="${Math.max(1, h - B - Y(it.value))}" rx="2" fill="var(--accent)"/>`;
    g += `<text x="${cx}" y="${h - 8}" text-anchor="middle" class="tx">${it.value == null ? '–' : ''}${esc(it.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${g}</svg>`;
}
const bar = (v, t, cls = '') => { const pct = t > 0 ? Math.min(100, v / t * 100) : 0; return `<div class="bar ${cls}${t > 0 && v > t ? ' over' : ''}"><i style="width:${pct.toFixed(1)}%"></i></div>`; };

'use strict';
/* NEX FIT nutrition: diary, foods, saved meals */
const mealName = k => (MEALS.find(m => m[0] === k) || [k, k])[1];
const fwd = () => `<span class="flip">${ico('back')}</span>`;
const itemOf = f => ({ foodId: f.id, name: f.name, unit: f.unit, ref: f.ref, kcal: f.kcal, p: f.p, c: f.c, f: f.f });
const kcalTxt = e => { const m = macrosOf(e); return m.kcal == null ? '—' : fmtN(m.kcal, 0); };

function macroLine(t) { return `P ${fmtN(t.p, 0)} · C ${fmtN(t.c, 0)} · F ${fmtN(t.f, 0)}`; }

function dayCard(d, compact) {
  const ents = entriesOn(d), t = totals(ents), tg = S.settings.targets, none = !ents.length;
  const rows = [['Protein', 'p'], ['Carbs', 'c'], ['Fat', 'f']].map(([n, k]) => {
    const tgt = tg[k];
    return `<div class="mrow"><div class="mrow-h"><span>${n}</span><span class="num">${none ? '—' : fmtN(t[k], 0)}${tgt ? ` / ${tgt} g` : ' g'}</span></div>${tgt ? bar(t[k], tgt, 'm-' + k) : ''}<div class="muted sm">${tgt ? (none ? 'Nothing logged' : (tgt - t[k] >= 0 ? `${fmtN(tgt - t[k], 0)} g left` : `${fmtN(t[k] - tgt, 0)} g over`)) : 'No target set'}</div></div>`;
  }).join('');
  let left;
  if (tg.kcal) left = none ? 'Nothing logged for this day' : (tg.kcal - t.kcal >= 0 ? `${fmtN(tg.kcal - t.kcal, 0)} kcal left` : `${fmtN(t.kcal - tg.kcal, 0)} kcal over`);
  else left = 'Set a calorie target in Settings';
  return `<section class="card"><div class="kcal-row"><div><div class="big num">${bigv(none ? '—' : fmtN(t.kcal, 0))}</div><div class="muted">kcal${tg.kcal ? ' of ' + tg.kcal : ''}</div></div><div class="kcal-left">${esc(left)}</div></div>${tg.kcal ? bar(t.kcal, tg.kcal, 'm-k') : ''}<div class="macros">${rows}</div>${t.partial ? '<p class="note">Some foods have no protein, carb or fat value entered, so those totals may read low.</p>' : ''}${compact ? '' : '<p class="note">Nutrition values are estimates from the numbers you enter, not medically precise measurements.</p>'}</section>`;
}

function renderNutrition() {
  const d = ui.nDate, isToday = d === today();
  let h = `<div class="datenav"><button class="icon-btn" data-act="n-day" data-n="-1" aria-label="Previous day">${ico('back')}</button><label class="datepick"><span>${isToday ? 'Today · ' : ''}${esc(fmtDate(d))}</span><input type="date" id="n-date" value="${d}" data-ch="n-date" aria-label="Choose date"></label><button class="icon-btn" data-act="n-day" data-n="1" aria-label="Next day">${fwd()}</button></div>`;
  h += dayCard(d);
  const fr = frequentFoods(6);
  if (fr.length || S.meals.length) {
    h += `<section class="block"><h3 class="sec">Quick add</h3><div class="chips">` +
      S.meals.slice(0, 6).map(m => `<button class="chip meal-chip" data-act="n-addmeal" data-id="${m.id}">${ico('plus', 14)} ${esc(m.name)}</button>`).join('') +
      fr.map(f => `<button class="chip" data-act="n-quick" data-id="${f.id}">${esc(f.name)}</button>`).join('') + `</div></section>`;
  }
  h += MEALS.map(([k, n]) => {
    const es = mealEntries(d, k), t = totals(es);
    return `<section class="card meal"><div class="meal-h"><h3>${n}</h3><span class="muted sm">${es.length ? `${fmtN(t.kcal, 0)} kcal · ${macroLine(t)}` : 'Not logged'}</span></div>` +
      es.map(e => { const m = macrosOf(e); return `<button class="erow" data-act="n-edit" data-id="${e.id}"><span class="en"><b>${esc(e.name)}</b><small>${fmtN(e.amount, 0)} ${esc(e.unit)} · P ${fmtN(m.p, 1)} C ${fmtN(m.c, 1)} F ${fmtN(m.f, 1)}</small></span><span class="num">${kcalTxt(e)}</span></button>`; }).join('') +
      `<div class="meal-a"><button class="btn sm primary" data-act="n-add" data-meal="${k}">${ico('plus', 16)} Add food</button><button class="btn sm" data-act="n-copy" data-meal="${k}">Copy from…</button>${es.length ? `<button class="btn sm" data-act="n-savemeal" data-meal="${k}">Save as meal</button>` : ''}</div></section>`;
  }).join('');
  h += `<div class="two"><button class="btn" data-act="n-meals">Saved meals (${S.meals.length})</button><button class="btn" data-act="n-foods">My foods (${S.foods.length})</button></div>`;
  return h;
}

/* ---- food picker ---- */
function foodRow(f, act, extra = '') {
  return `<button class="erow" data-act="${act}" data-id="${f.id}"><span class="en"><b>${esc(f.name)}</b><small>${esc(f.brand ? f.brand + ' · ' : '')}${fmtN(f.kcal, 0)} kcal per ${fmtN(f.ref, 0)} ${esc(f.unit)}</small></span>${extra}</button>`;
}
function pickerList(q, mode) {
  q = (q || '').trim().toLowerCase();
  let foods = S.foods.slice().sort((a, b) => a.name.localeCompare(b.name));
  if (q) foods = foods.filter(f => (f.name + ' ' + (f.brand || '')).toLowerCase().includes(q));
  let h = '';
  if (!q && mode === 'log') {
    const fr = frequentFoods(5);
    if (S.meals.length) h += `<h3 class="sec">Saved meals</h3>` + S.meals.map(m => `<button class="erow" data-act="fp-meal" data-id="${m.id}"><span class="en"><b>${esc(m.name)}</b><small>${m.items.length} items · ${fmtN(totals(m.items).kcal, 0)} kcal · adds to ${mealName(m.meal || 'snacks')}</small></span>${ico('plus', 18)}</button>`).join('');
    if (fr.length) h += `<h3 class="sec">Frequent</h3>` + fr.map(f => foodRow(f, 'fp-food')).join('');
    if (foods.length) h += `<h3 class="sec">All foods</h3>`;
  }
  h += foods.map(f => foodRow(f, 'fp-food')).join('');
  if (!foods.length) h += q ? `<div class="empty"><p>No food named “${esc(q)}” in your list.</p><button class="btn primary" data-act="fp-new" data-name="${esc(q)}">Create “${esc(q)}”</button></div>` : `<div class="empty"><p><b>No foods yet.</b> Create one using the values on the package label. Everything stays on this device, and no food database is bundled so the app works offline.</p><button class="btn primary" data-act="fp-new">Create your first food</button></div>`;
  return h;
}

/* ---- amount sheet (add or edit a logged food) ---- */
function openAmount(o) {
  const editing = !!o.entry, base = editing ? o.entry : o.item;
  const draft = { amount: editing ? o.entry.amount : (o.serving || base.ref || 100), meal: editing ? o.entry.meal : o.meal, date: editing ? o.entry.date : o.date };
  const chips = () => { const v = [...new Set([o.serving, 50, 100, 150, 200].filter(x => x > 0))]; return v.map(x => `<button class="chip${+draft.amount === x ? ' on' : ''}" data-act="am-chip" data-v="${x}">${x} ${esc(base.unit)}</button>`).join(''); };
  const prev = () => { const m = macrosOf({ ...base, amount: +draft.amount || 0 }); return `<div class="pv-k num">${m.kcal == null ? '—' : fmtN(m.kcal, 0)}<small> kcal</small></div><div class="pv-m">${['p', 'c', 'f'].map((k, i) => `<span><b>${m[k] == null ? '—' : fmtN(m[k], 1)} g</b> ${['protein', 'carbs', 'fat'][i]}</span>`).join('')}</div>`; };
  openSheet(s => sheetHTML({
    title: editing ? 'Edit entry' : (base.name || 'Add food'),
    body: `<section class="card"><h3>${esc(base.name)}</h3><p class="muted sm">${fmtN(base.kcal, 0)} kcal${['p', 'c', 'f'].map((k, i) => ` · ${base[k] == null ? '? ' : fmtN(base[k], 1) + ' g '}${['P', 'C', 'F'][i]}`).join('')} per ${fmtN(base.ref, 0)} ${esc(base.unit)}</p></section>
<label class="lbl" for="am-amt">Amount (${esc(base.unit)})</label><input class="in lg" id="am-amt" inputmode="decimal" data-num data-d="amount" data-live="1" value="${esc(draft.amount)}" autocomplete="off"><div class="chips pad">${chips()}</div>
<div class="grid2"><div><label class="lbl" for="am-meal">Meal</label><select class="in" id="am-meal" data-d="meal">${MEALS.map(([k, n]) => `<option value="${k}"${draft.meal === k ? ' selected' : ''}>${n}</option>`).join('')}</select></div><div><label class="lbl" for="am-date">Date</label><input class="in" id="am-date" type="date" data-d="date" value="${draft.date}"></div></div>
<div class="card preview" id="am-prev">${prev()}</div>${base.p == null || base.c == null || base.f == null ? '<p class="note">This food has no value entered for some macros, so they are not counted.</p>' : ''}`,
    foot: `${editing ? `<button class="btn danger" data-act="am-del">${ico('trash', 18)}</button>` : ''}<button class="btn primary grow" data-act="am-save">${editing ? 'Save changes' : 'Add to ' + esc(mealName(draft.meal))}</button>`
  }), { kind: 'amount', draft, o, base, editing, live: (s) => { $('#am-prev', s.el).innerHTML = prev(); } });
}

  else { const b = s.base; put('entries', { id: uid(), date: d.date, meal: d.meal, foodId: b.foodId || null, name: b.name, unit: b.unit, amount: d.amount, ref: b.ref, kcal: b.kcal, p: b.p, c: b.c, f: b.f, ts: Date.now() }); toast(`Added to ${mealName(d.meal)}`); }

function movingAvg(ws) { return ws.map(p => { const lo = addDays(p.date, -6); return { date: p.date, kg: avg(ws.filter(x => x.date >= lo && x.date <= p.date).map(x => x.kg)) }; }); }

function renderTrainingProgress() {
  const map = sessionsMap(), ids = Object.keys(map);

  const t = today(), items = [];
  for (let i = 7; i >= 0; i--) {
    const ws = weekStart(addDays(t, -7 * i)), we = addDays(ws, 6), wl = S.workouts.filter(w => w.date >= ws && w.date <= we), vols = wl.map(w => wkStats(w).vol).filter(v => v != null);

  }
  let h = `<section class="card"><h3>Weekly volume (${wUnit()})</h3>${items.some(i => i.value != null) ? `<div class="chartcard">${barChart({ items, label: 'Weekly training volume' })}</div><p class="note">Weeks with no weighted sets logged show a dash, not zero. Volume is weight × reps for completed sets.</p>` : '<p class="muted">No weighted sets logged in the last 8 weeks.</p>'}</section>`;
  const rows = ids.map(id => { const ss = map[id], last = ss[ss.length - 1], first = ss[0], useE = ss.every(x => x.e1 != null) && ss.length > 0; return { id, name: exName(id, id.replace(/^n:/, '')), n: ss.length, last, best: useE ? Math.max(...ss.map(x => x.e1)) : Math.max(...ss.map(x => x.topW)), useE, change: ss.length > 1 ? (useE ? last.e1 - first.e1 : last.topW - first.topW) : null }; }).sort((a, b) => a.last.key < b.last.key ? 1 : -1);
  h += `<h3 class="sec">Exercises</h3>` + rows.map(r => `<button class="erow" data-act="tp-open" data-id="${r.id}"><span class="en"><b>${esc(r.name)}</b><small>${r.n} session${r.n === 1 ? '' : 's'} · ${r.useE ? 'est. 1RM' : 'heaviest'} ${fWu(r.best, 1)}</small></span><span class="sm">${r.change != null ? upDown(kgToDisp(r.change), 1, wUnit()) + '<div class="muted xs">since first log</div>' : '<span class="muted">1 session</span>'}</span></button>`).join('');
  const prs = allPRs().slice().sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 12);
  h += `<h3 class="sec">Recent records</h3>` + (prs.length ? prs.map(p => `<div class="erow static pr"><span class="en"><b>${esc(exName(p.id))}</b><small>${esc(prText({ ...p, ex: null }))} · ${esc(fmtDate(p.date, { day: 'numeric', month: 'short' }))}</small></span><span class="badge">PR</span></div>`).join('') : `<p class="note">No records yet. A record needs an earlier logged session to beat, so your first log of each exercise is the baseline.</p>`);

}

/* ---------------- Weekly review ---------------- */
function weekData(ws) {
  const we = addDays(ws, 6), t = today(), inW = d => d >= ws && d <= we;
  const wks = S.workouts.filter(w => inW(w.date)), planned = new Set(S.templates.filter(x => x.day >= 0).map(x => x.day)).size;
  const wts = S.weights.filter(x => inW(x.date)), pws = S.weights.filter(x => x.date >= addDays(ws, -7) && x.date <= addDays(ws, -1));
  const days = []; for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d <= t) { const es = entriesOn(d); if (es.length) days.push({ d, t: totals(es) }); } }
  const perf = [];
  S.exercises.concat([]); // keep order stable
  const map = sessionsMap();
  Object.entries(map).forEach(([id, ss]) => {
    const inWeek = ss.filter(x => inW(x.date)); if (!inWeek.length) return;
    const prior = ss.filter(x => x.date < ws); if (!prior.length) return;
    const cur = inWeek.reduce((a, b) => ((b.e1 ?? b.topW) > (a.e1 ?? a.topW) ? b : a)), pr = prior[prior.length - 1], useE = cur.e1 != null && pr.e1 != null;
    perf.push({ id, d: useE ? cur.e1 - pr.e1 : cur.topW - pr.topW, what: useE ? 'est. 1RM' : 'top weight' });
  });
  return { ws, we, wks, planned, wts, pws, days, perf, prs: allPRs().filter(p => inW(p.date)), minutes: sum(wks.map(w => w.dur || 0)) / 60 };
}

  const wAvg = D.wts.length >= 2 ? avg(D.wts.map(x => x.kg)) : null, pAvg = D.pws.length >= 2 ? avg(D.pws.map(x => x.kg)) : null;
  let h = `<div class="datenav"><button class="icon-btn" data-act="wk-wk" data-n="-1" aria-label="Previous week">${ico('back')}</button><div class="datepick static"><span>${esc(fmtDate(ws, { day: 'numeric', month: 'short' }))} – ${esc(fmtDate(D.we, { day: 'numeric', month: 'short' }))}${off === 0 ? ' · this week' : ''}</span></div><button class="icon-btn" data-act="wk-wk" data-n="1" aria-label="Next week" ${off >= 0 ? 'disabled' : ''}>${fwd()}</button></div>`;
  h += `<section class="card"><h3>Training</h3><div class="stats"><div><b class="num">${D.wks.length}</b><span>workouts</span></div><div><b class="num">${D.planned ? Math.min(100, Math.round(D.wks.length / D.planned * 100)) + '%' : '—'}</b><span>of ${D.planned || 'no'} planned</span></div><div><b class="num">${D.wks.length ? Math.round(D.minutes) : '—'}</b><span>minutes</span></div></div>${D.planned ? '' : '<p class="note">Give your plans a weekday to track consistency.</p>'}${D.wks.length ? '' : '<p class="note">No workouts logged this week.</p>'}</section>`;
  h += `<section class="card"><h3>Body weight</h3>`;
  if (wAvg != null) h += `<div class="kcal-row"><div><div class="big num">${fW(wAvg, 1)}<small> ${wUnit()}</small></div><div class="muted sm">average of ${D.wts.length} weigh-ins</div></div><div class="kcal-left">${pAvg != null ? upDown(kgToDisp(wAvg - pAvg), 1, wUnit(), true) + '<div class="muted sm">vs last week’s average</div>' : '<span class="muted sm">Last week had fewer than 2 weigh-ins, so no comparison</span>'}</div></div>`;
  else h += D.wts.length === 1 ? `<p>${fW(D.wts[0].kg, 1)} ${wUnit()} on ${esc(fmtDate(D.wts[0].date))}.</p><p class="note">One weigh-in only. An average needs at least 2 in the week.</p>` : `<p class="muted">No weigh-ins this week.</p>`;

/* ---- dates ---- */

    const wk = g('wk'); if (wk) lastWk = wk;
    const name = g('ex'); if (!name) return;
    const reps = txNums(g('reps')), wcell = g('w').toLowerCase(), ws = txNums(wcell), nSetsCell = parseFloat(g('sets'));
    if (!reps.length && !(nSetsCell > 0)) { warns.push(r.join(' | ')); return; }
    const unit = (wcell.match(new RegExp(TX_UNIT)) || [])[1] || headerUnit || null;
    const n = roles.setNo !== undefined ? 1 : (nSetsCell > 0 ? Math.min(Math.round(nSetsCell), 50) : Math.max(reps.length, ws.length, 1));
    const pick = (a, i) => a.length ? (a.length > 1 ? (a[i] != null ? a[i] : a[a.length - 1]) : a[0]) : null;
    const sets = [];
    for (let i = 0; i < n; i++) { const rr = pick(reps, i); if (rr == null) { warns.push(r.join(' | ')); return; } const w = pick(ws, i); sets.push({ w: w != null && w > 0 ? txKg(w, unit) : null, r: Math.round(rr) }); }
    const rpeV = parseFloat(g('rpe')), key = (lastDate || '') + '|' + lastWk;
    if (!map.has(key)) map.set(key, { name: lastWk, date: lastDate, exercises: [] });
    const b = map.get(key), prev = b.exercises.find(e => txKey(e.name) === txKey((txFindEx(name) || { name }).name));
    const e = txEntry(name, sets, rpeV >= 5 && rpeV <= 10 ? rpeV : null, g('notes'));
    if (prev) prev.sets.push(...e.sets); else b.exercises.push(e);
  });
  return { blocks: [...map.values()], warns };
}

/* ---- entry point: decides table vs text ---- */
function txParse(text) {
  text = String(text || '').replace(/^﻿/, '');
  const first = text.split('\n').find(l => l.trim()) || '';
  const delim = first.includes('\t') ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  if (first.includes(delim)) {
    const rows = txCSV(text, delim);
    for (let i = 0; i < Math.min(3, rows.length); i++) {
      const roles = txHeader(rows[i]);
      if (roles) { const h = rows[i][roles.w] || ''; return txParseTable(rows, i, roles, /lb/i.test(h) ? 'lb' : /kg|كجم/i.test(h) ? 'kg' : null); }
    }
  }
  return txParseText(text);
}

/* ---- blocks -> workouts, skipping ones already in history ---- */
const txSig = w => w.date + '|' + w.exercises.map(e => txKey(e.name) + ':' + e.sets.map(s => (s.w || 0) + 'x' + s.r).join(',')).join(';');
function txBuild(blocks, defDate) {
  const have = new Set(S.workouts.map(txSig)), fresh = []; let dupes = 0;
  blocks.filter(b => b.exercises.length).forEach((b, i) => {
    const date = b.date || defDate, t0 = parseYmd(date).getTime() + 12 * 3600e3 + i * 60e3;
    const w = { id: uid(), name: b.name || 'Imported workout', date, start: t0, end: t0, dur: 0, templateId: null, note: 'Imported', exercises: b.exercises };
    const sig = txSig(w);
    if (have.has(sig)) { dupes++; return; }
    have.add(sig); fresh.push(w);
  });
  return { fresh, dupes };
}

/* ---- analysis of what is about to be imported (uses the app's own maths) ---- */
function txAnalyze(ws) {
  const all = S.workouts.concat(ws).slice().sort((a, b) => wkKey(a) < wkKey(b) ? -1 : 1), ids = new Set(ws.map(w => w.id)), per = {};
  all.forEach(w => w.exercises.forEach(ex => { const s = sessionOf(w, ex); if (s) (per[exKey(ex)] = per[exKey(ex)] || []).push({ s, nw: ids.has(w.id), name: ex.name, exId: ex.exId }); }));
  const exRows = [], flags = [], musc = {};
  Object.values(per).forEach(list => {
    const news = list.filter(x => x.nw); if (!news.length) return;
    const name = news[0].name, firstNew = news[0].s, lastNew = news[news.length - 1].s, before = list.filter(x => !x.nw && x.s.key < firstNew.key).pop();
    const base = before ? before.s : firstNew, useE = lastNew.e1 != null && base.e1 != null;
    const a = useE ? base.e1 : base.topW, b = useE ? lastNew.e1 : lastNew.topW, d = b - a;
    let line;
    if (lastNew.topW > 0) line = `Top ${fWu(lastNew.topW, 1)} · est. 1RM ${fWu(lastNew.e1, 1)}${news.length > 1 || before ? ` · ${useE ? '1RM' : 'top weight'} ${d >= 0.05 ? '+' : d <= -0.05 ? '−' : '±'}${fW(Math.abs(d), 1)} ${wUnit()} vs ${before ? 'last logged' : 'first session'}` : ''}`;
    else line = `Best ${lastNew.maxRepsBW} reps (bodyweight)`;
    exRows.push({ name, n: news.length, line });
    const l3 = list.slice(-3);
    if (l3.length === 3 && l3.some(x => x.nw) && l3[0].s.topW > 0 && Math.max(...l3.map(x => x.s.e1 || x.s.topW)) <= (l3[0].s.e1 || l3[0].s.topW) + 0.01) flags.push(`${name}: no progress over the last 3 sessions`);
  });
  let sets = 0, vol = 0, volAny = false, dMin = null, dMax = null;
  ws.forEach(w => {
    if (dMin == null || w.date < dMin) dMin = w.date; if (dMax == null || w.date > dMax) dMax = w.date;
    w.exercises.forEach(ex => { const m = txMuscle(ex.exId, ex.name); ex.sets.forEach(s => { if (!(s.r > 0)) return; sets++; musc[m] = (musc[m] || 0) + 1; if (s.w > 0) { vol += s.w * s.r; volAny = true; } }); });
  });
  const days = dMin && dMax ? Math.round((parseYmd(dMax) - parseYmd(dMin)) / 864e5) + 1 : 1, weeks = Math.max(1, days / 7);
  const push = (musc.Chest || 0) + (musc.Shoulders || 0) + (musc.Triceps || 0), pull = (musc.Back || 0) + (musc.Biceps || 0), legs = (musc.Quads || 0) + (musc.Hamstrings || 0) + (musc.Glutes || 0) + (musc.Calves || 0);
  if (push + pull + legs > 0) {
    if (push > pull * 1.6 && pull >= 0) flags.push(`Pushing (${push} sets) clearly outweighs pulling (${pull} sets)`);
    if (legs < (push + pull) * 0.25 && push + pull > 8) flags.push(`Leg work is low: ${legs} sets vs ${push + pull} upper-body sets`);
  }
  return { sets, vol: volAny ? vol : null, days, weeks, musc, exRows, flags, dMin, dMax, push, pull, legs };
}

/* ---- Google Sheet link -> CSV url ---- */
function txSheetUrl(u) {
  u = String(u || '').trim(); if (!/^https?:\/\/docs\.google\.com\/spreadsheets\//i.test(u)) return null;
  const gid = (u.match(/[#&?]gid=(\d+)/) || [])[1];
  if (/\/d\/e\//.test(u)) { let v = u.replace(/pubhtml/, 'pub'); v = /output=/.test(v) ? v.replace(/output=\w+/, 'output=csv') : v + (v.includes('?') ? '&' : '?') + 'output=csv'; return v; }
  const id = (u.match(/\/spreadsheets\/d\/([A-Za-z0-9_-]+)/) || [])[1]; if (!id) return null;
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv${gid ? '&gid=' + gid : ''}`;
}

/* ---- UI ---- */
function openTextImport() {
  openSheet(s => {
    const r = s.res; let out = '';
    if (r) {
      const w = r.fresh;
      if (r.warns.length) out += `<section class="card" style="border-color:var(--warn)"><b>${r.warns.length} line${r.warns.length === 1 ? '' : 's'} could not be read</b><ul class="howto">${r.warns.slice(0, 8).map(x => `<li>${esc(x)}</li>`).join('')}</ul>${r.warns.length > 8 ? `<p class="note">…and ${r.warns.length - 8} more.</p>` : ''}<p class="note">Use a layout like “Squat 4x8 @ 80” or “Deadlift 100x5, 110x3”. Cardio and timed sets are not supported yet.</p></section>`;
      if (r.dupes) out += `<p class="note">${r.dupes} workout${r.dupes === 1 ? ' is' : 's are'} already in your history and will be skipped.</p>`;
      if (!w.length) out += `<div class="empty"><p><b>Nothing new to import.</b> ${r.dupes ? 'Everything here is already saved.' : 'No exercises were recognised. Check the layout hints above.'}</p></div>`;
      else {
        const a = r.an;
        out += `<section class="card"><h3>Analysis</h3><p><b class="num">${w.length}</b> workout${w.length === 1 ? '' : 's'} · <b class="num">${a.sets}</b> sets${a.vol != null ? ` · ${fW(a.vol, 0)} ${wUnit()} volume` : ''} · ${esc(fmtDate(a.dMin))}${a.dMax !== a.dMin ? ' to ' + esc(fmtDate(a.dMax)) : ''}</p>`;
        const ms = Object.entries(a.musc).sort((x, y) => y[1] - x[1]);
        out += `<h3 class="sec">Sets per muscle${a.weeks > 1.4 ? ' (per week)' : ''}</h3>${ms.map(([m, n]) => `<div class="erow static"><span class="en"><b>${esc(m)}</b></span><span class="num">${a.weeks > 1.4 ? fmtN(n / a.weeks, 1) : n}</span></div>`).join('')}`;
        if (a.push + a.pull + a.legs) out += `<p class="muted sm">Push ${a.push} · Pull ${a.pull} · Legs ${a.legs} sets</p>`;
        if (a.flags.length) out += `<h3 class="sec">Worth a look</h3><ul class="howto">${a.flags.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
        out += `<h3 class="sec">Progress by exercise</h3>${a.exRows.map(x => `<div class="erow static"><span class="en"><b>${esc(x.name)}</b><small>${x.n} session${x.n === 1 ? '' : 's'} · ${esc(x.line)}</small></span></div>`).join('')}</section>`;
        out += `<h3 class="sec">Will be saved</h3>${w.map(x => `<section class="card"><b>${esc(x.name)}</b><p class="muted sm">${esc(fmtDate(x.date))}</p>${x.exercises.map(e => `<div class="erow static"><span class="en"><b>${esc(e.name)}</b><small>${e.sets.map(setTxt).join('  ')}${e.exId ? '' : ' · not in your exercise list'}</small></span></div>`).join('')}</section>`).join('')}`;
      }
    }
    const foot = r && r.fresh.length ? `<button class="btn primary grow" data-act="tx-save">Save ${r.fresh.length} workout${r.fresh.length === 1 ? '' : 's'} to history</button>` : '';
    return sheetHTML({
      title: 'Import workouts', close: 'x', foot, body: `<p class="muted">Paste your workouts, or load a Google Sheet. Examples:</p><pre class="note" style="white-space:pre-wrap">2026-10-12 Push day\nBench Press 4x8 @ 60\nOverhead Press 3x10 40kg\nDeadlift 100x5, 110x3\nPull Ups 3x8</pre><label class="lbl" for="tx-text">Workout text, or cells copied from a sheet</label><textarea class="in" id="tx-text" rows="8" data-d="text" placeholder="Paste here" autocomplete="off">${esc(s.draft.text)}</textarea><div class="grid2"><div><label class="lbl" for="tx-date">Date for lines without one</label><input class="in" id="tx-date" type="date" data-d="date" value="${esc(s.draft.date)}"></div></div><button class="btn primary" data-act="tx-run">Read &amp; analyze</button><label class="lbl" for="tx-url">Google Sheet link</label><input class="in" id="tx-url" type="url" data-d="url" value="${esc(s.draft.url)}" placeholder="https://docs.google.com/spreadsheets/d/…" autocomplete="off"><button class="btn" data-act="tx-fetch">Load sheet</button><p class="note">The sheet must be shared as “Anyone with the link can view”, or published to the web as CSV. Plain numbers are read in your current unit (${wUnit()}); write kg or lb to override. Weights are never sent anywhere. The link is only used to download the sheet.</p><div id="tx-res"></div>${out}`
    });
  }, { kind: 'txtimport', draft: { text: '', url: '', date: today() }, res: null });
}
function txRun(s) {
  const d = s.draft; if (!d.text.trim()) { toast('Paste your workouts or load a sheet first.', 'err'); return; }
  const p = txParse(d.text), b = txBuild(p.blocks, d.date || today());
  s.res = { fresh: b.fresh, dupes: b.dupes, warns: p.warns, an: b.fresh.length ? txAnalyze(b.fresh) : null };
  paintSheet(s);
  const a = s.el.querySelector('#tx-res'); if (a && a.scrollIntoView) a.scrollIntoView({ block: 'start' });
}
ACT['tx-open'] = () => openTextImport();
ACT['tx-run'] = el => txRun(sheetOf(el));
ACT['tx-fetch'] = async el => {
  const s = sheetOf(el), url = txSheetUrl(s.draft.url);
  if (!url) { toast('Paste a Google Sheets link (docs.google.com/spreadsheets/…).', 'err'); return; }
  toast('Loading sheet…');
  try {
    const res = await fetch(url, { credentials: 'omit' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if (/^\s*<(!doctype|html)/i.test(text)) throw new Error('not csv');
    s.draft.text = text; txRun(s);
  } catch (e) { toast('Could not load the sheet. Share it as “Anyone with the link can view”, or copy the cells and paste them above.', 'err'); }
};
ACT['tx-save'] = el => {
  const s = sheetOf(el), r = s.res; if (!r || !r.fresh.length) return;
  r.fresh.forEach(w => put('workouts', w));
  const n = r.fresh.length; closeSheet(s); ui.tab = 'training'; ui.tTab = 'history'; rerender(); window.scrollTo(0, 0);
  toast(`Imported ${n} workout${n === 1 ? '' : 's'}`);
};

'use strict';
/* NEX FIT bootstrap, navigation, offline registration */
const ui = { tab: 'home', nDate: today(), tTab: 'plans', exQ: '', exM: 'All', pTab: 'body', wRange: '90', wkOff: 0, mType: null, cmp: null, wAll: false };
const TABS = [['home', 'Home', 'home'], ['training', 'Training', 'train'], ['nutrition', 'Nutrition', 'food'], ['progress', 'Progress', 'chart'], ['settings', 'Settings', 'gear']];
let lastToday = today();

function buildNav() {
  $('#nav').innerHTML = TABS.map(([k, n, i]) => `<button data-act="tab" data-v="${k}" data-tab="${k}">${ico(i, 24)}<span>${n}</span></button>`).join('');
}
function renderPage() {
  const y = window.scrollY, t = ui.tab;
  const title = t === 'home' ? 'NEX<span>FIT</span>' : TABS.find(x => x[0] === t)[1];
  const sub = t === 'home' ? fmtDateLong(today()) : '';
  const body = t === 'home' ? renderHome() : t === 'training' ? renderTraining() : t === 'nutrition' ? renderNutrition() : t === 'progress' ? renderProgress() : renderSettings();
  const warn = storageOK ? '' : `<section class="card" style="border-color:var(--bad)"><b style="color:var(--bad)">Storage is unavailable</b><p class="muted sm">This browser is blocking local storage, so nothing you log will be kept after you close this page. Export a backup from Settings before leaving, or open the app in a normal (non-private) browser window.</p></section>`;
  $('#view').innerHTML = `<header class="top"><h1>${title}</h1><span class="date">${esc(sub)}</span></header>${warn}${body}`;
  $$('#nav button').forEach(b => { if (b.dataset.tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  window.scrollTo(0, y);
}
ACT.tab = el => { if (ui.tab !== el.dataset.v) { ui.tab = el.dataset.v; renderPage(); window.scrollTo(0, 0); } else window.scrollTo({ top: 0 }); };

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = today();
  if (t !== lastToday) { if (ui.nDate === lastToday) ui.nDate = t; lastToday = t; rerender(); }
});

async function registerSW() {
  offlineState = { ok: false, text: 'Not available in this preview. Install the app from your own web address (see Settings → About, and the README).' };
  try {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const has = window.caches ? await caches.has('nexfit-v' + VERSION) : false;
    offlineState = has ? { ok: true, text: 'Ready. The app files are cached on this device.' } : { ok: false, text: 'Registered. Reload once while online to finish caching.' };
  } catch (e) { offlineState = { ok: false, text: 'Not available here. Install the app from your own web address (see the README).' }; }
  if (ui.tab === 'settings') renderPage();
}

(async function boot() {
  await initData();
  applyTheme(); buildNav(); renderPage();
  registerSW();
})();

</script>
